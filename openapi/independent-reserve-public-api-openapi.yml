      - Public
      summary: Returns the Order Book for a given currency pair including order identifiers
      x-source: https://www.independentreserve.com/features/api
      parameters:
      - name: primaryCurrencyCode
        in: query
        required: true
        schema:
          type: string
        description: The cryptocurrency for which to retrieve order book.
      - name: secondaryCurrencyCode
        in: query
        required: true
        schema:
          type: string
        description: The fiat currency in which to retrieve order book.
      - name: maxDepthVolume
        in: query
        required: false
        schema:
          type: number
        description: Limit the results to a maximum cumulated volume.
      - name: maxDepthValue
        in: query
        required: false
        schema:
          type: number
        description: Limit the results to a maximum value (price * volume).
